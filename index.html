<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Sprint Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">
    <h1>🎯 Study Sprint Tracker</h1>

    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Enter study task">
      <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="progress">
      Completed Tasks: <span id="count">0</span>
    </div>

    <div class="timer">
      <h2>⏳ Focus Timer</h2>
      <input type="number" id="minutesInput" placeholder="Enter minutes">

<p id="time">25:00</p>

<button onclick="startTimer()">Start Timer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
