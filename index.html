<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Study Sprint Tracker</title>

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="style.css">

</head>

<body>

  <div class="container">

    <!-- DARK LIGHT BUTTON -->

    <button class="toggle-btn"
      onclick="toggleTheme()">
      🌙
    </button>


    <!-- TITLE -->

    <h1>
      🎯 Study Sprint Tracker
    </h1>


    <!-- QUOTE -->

    <p id="quote"></p>


    <!-- INPUT SECTION -->

    <div class="input-section">

      <input
        type="text"
        id="taskInput"
        placeholder="Enter study task">


      <!-- CATEGORY -->

      <select id="category">

        <option>Java</option>

        <option>Python</option>

        <option>Aptitude</option>

        <option>Placement Prep</option>

      </select>


      <button onclick="addTask()">

        Add

      </button>

    </div>


    <!-- TASK LIST -->

    <ul id="taskList"></ul>


    <!-- PROGRESS -->

    <div class="progress">

      <p>

        Completed Tasks:
        <span id="count">0</span>

      </p>


      <!-- PROGRESS BAR -->

      <div class="progress-bar">

        <div id="progressFill"></div>

      </div>


      <!-- PROGRESS TEXT -->

      <p id="progressText">

        0% Completed

      </p>

    </div>


    <!-- STREAK -->

    <div class="streak">

      🔥 Streak:
      <span id="streak">0</span>

    </div>


    <!-- TIMER -->

    <div class="timer">

      <h2>

        ⏳ Focus Timer

      </h2>


      <input
        type="number"
        id="minutesInput"
        placeholder="Enter minutes">


      <p id="time">

        25:00

      </p>


      <button onclick="startTimer()">

        Start Timer

      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
